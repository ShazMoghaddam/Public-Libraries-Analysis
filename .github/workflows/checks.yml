name: Checks

# Rebuilds the data, charts and report and runs the tests on every pull request,
# so a change to the code can't quietly break the findings.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python data/prepare.py
      - run: python findings/build.py
      - run: pytest -q
      - name: Notebook runs from top to bottom
        run: jupyter nbconvert --to notebook --execute notebooks/public_libraries_analysis.ipynb --output-dir /tmp
      - name: Data, charts and report match the code
        run: git diff --exit-code -- data charts findings/README.md README.md || (echo "Run python data/prepare.py and python findings/build.py and commit the results" && exit 1)
